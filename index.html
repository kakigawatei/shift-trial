<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>シフト希望（おはし二日町／落合）</title>
<style>
  :root{ --g:#2a6e5a; --gl:#e8f5ef; --navy:#31415e; --bg:#f4f6f9; --tx:#1d2733; --sub:#5b6b7c; --bd:#d7dee6; --warn:#b3540e; --warnbg:#fdeee0; --ng:#c94f4f; --ngbg:#fdecec; --tm:#a8720e; --tmbg:#fff6e3; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:"Hiragino Sans","Yu Gothic UI",sans-serif; }
  body{ background:var(--bg); color:var(--tx); max-width:560px; margin:0 auto; padding-bottom:160px; }
  .hd{ background:var(--g); color:#fff; padding:calc(env(safe-area-inset-top) + 12px) 16px 10px; position:sticky; top:0; z-index:5; }
  .hd.mgr{ background:var(--navy); }
  .hd .s{ font-size:12px; opacity:.85; font-weight:700; display:flex; justify-content:space-between; }
  .hd h1{ font-size:17px; font-weight:800; margin-top:2px; }
  .hd .due{ margin-top:6px; display:inline-block; background:rgba(255,255,255,.18); border-radius:999px; padding:3px 12px; font-size:11.5px; font-weight:700; }
  .sync{ font-size:10.5px; opacity:.8; }
  .wrap{ padding:10px 12px; }
  .tip{ font-size:11.5px; color:var(--sub); line-height:1.55; margin:2px 2px 10px; }
  .card{ background:#fff; border-radius:12px; padding:12px; margin-bottom:10px; box-shadow:0 1px 2px rgba(20,40,60,.06); }
  button{ cursor:pointer; }
  /* 役割選択 */
  .who{ display:flex; flex-direction:column; gap:8px; }
  .who button{ background:#fff; border:1.5px solid var(--bd); border-radius:12px; padding:14px; font-size:15px; font-weight:800; color:var(--tx); text-align:left; }
  .who button:active{ background:var(--gl); }
  .mini{ font-size:11.5px; color:var(--sub); font-weight:700; }
  /* 従業員: 日リスト */
  .day{ background:#fff; border-radius:12px; padding:10px 12px; margin-bottom:8px; display:flex; align-items:flex-start; gap:10px; box-shadow:0 1px 2px rgba(20,40,60,.06); }
  .d{ width:46px; text-align:center; padding-top:3px; flex:none; }
  .d .n{ font-size:17px; font-weight:800; }
  .d .w{ font-size:10.5px; color:#8a97a5; font-weight:700; }
  .d .w.sat{ color:#2b6fbf; } .d .w.sun{ color:var(--ng); }
  .segwrap{ flex:1; }
  .seg{ display:flex; gap:6px; }
  .seg button{ flex:1; border:1.5px solid var(--bd); background:#fff; border-radius:9px; padding:9px 0; font-size:12.5px; font-weight:800; color:var(--sub); white-space:nowrap; }
  .seg .on-ok{ background:var(--gl); border-color:var(--g); color:var(--g); }
  .seg .on-ng{ background:var(--ngbg); border-color:var(--ng); color:var(--ng); }
  .seg .on-tm{ background:var(--tmbg); border-color:#d99a26; color:var(--tm); }
  .times{ display:flex; gap:6px; align-items:center; margin-top:7px; font-size:12px; color:var(--tm); font-weight:700; flex-wrap:wrap; }
  .times input{ border:1.5px solid #e3cf9e; border-radius:8px; padding:5px 7px; font-size:13px; font-weight:700; color:var(--tm); background:#fffdf6; }
  .foot{ position:fixed; bottom:0; left:0; right:0; max-width:560px; margin:0 auto; background:#fff; padding:9px 14px calc(env(safe-area-inset-bottom) + 10px); box-shadow:0 -4px 14px rgba(20,40,60,.08); z-index:5; }
  .send{ width:100%; background:var(--g); color:#fff; border:0; border-radius:12px; padding:14px 0; font-size:15px; font-weight:800; }
  .stat{ text-align:center; font-size:11.5px; color:var(--sub); margin-bottom:7px; font-weight:700; }
  /* 店長 */
  .tabs{ display:flex; gap:6px; margin-bottom:10px; }
  .tabs button{ flex:1; border:1.5px solid var(--bd); background:#fff; border-radius:10px; padding:9px 0; font-size:12.5px; font-weight:800; color:var(--sub); }
  .tabs .on{ background:var(--navy); border-color:var(--navy); color:#fff; }
  table.req{ width:100%; border-collapse:collapse; font-size:11px; }
  table.req th, table.req td{ border:1px solid #e3e8ee; padding:4px 2px; text-align:center; }
  table.req th{ background:#eef2f7; font-size:10.5px; }
  table.req td.ok{ color:var(--g); font-weight:800; }
  table.req td.ng{ color:var(--ng); font-weight:800; background:var(--ngbg); }
  table.req td.tm{ color:var(--tm); font-weight:700; background:var(--tmbg); font-size:9.5px; }
  table.req td.none{ color:#c3ccd6; }
  .daynav{ display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:10px; }
  .daynav button{ width:34px; height:34px; border-radius:9px; border:1.5px solid var(--bd); background:#fff; font-size:15px; font-weight:800; color:var(--navy); }
  .daynav .dl{ font-size:15.5px; font-weight:800; min-width:96px; text-align:center; }
  .aibar{ display:flex; gap:8px; margin-bottom:10px; }
  .aibar .gen{ flex:1; background:#7a5cd6; color:#fff; border:0; border-radius:11px; padding:11px 0; font-size:13px; font-weight:800; }
  .aibar .prn{ width:74px; background:#fff; color:var(--navy); border:1.5px solid var(--bd); border-radius:11px; font-size:12.5px; font-weight:800; }
  .slot{ background:#fff; border-radius:12px; padding:9px 11px; margin-bottom:8px; box-shadow:0 1px 2px rgba(20,40,60,.06); }
  .slot .t{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .slot .tm2{ font-size:12.5px; font-weight:800; color:var(--navy); }
  .slot .req2{ font-size:11px; font-weight:800; color:var(--g); background:var(--gl); border-radius:999px; padding:2px 9px; }
  .slot .req2.warn{ color:var(--warn); background:var(--warnbg); }
  .chips{ display:flex; flex-wrap:wrap; gap:5px; }
  .chip{ font-size:11.5px; font-weight:800; border-radius:999px; padding:6px 11px; background:#eef2f7; color:#334; border:1px solid #dbe3ec; }
  .chip.add{ background:#fff; border:1.5px dashed #b6c2d0; color:#7b8a99; }
  /* ガントチャート（シフト作成ボード） */
  .gantt{ background:#fff; border-radius:12px; padding:10px 8px 8px; box-shadow:0 1px 2px rgba(20,40,60,.06); }
  .gsc{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .gin{ min-width:680px; }
  .ghead,.grow,.gneed{ display:flex; }
  .glabel{ width:66px; flex:none; font-size:10px; font-weight:800; color:var(--sub); display:flex; align-items:center; }
  .gcells{ flex:1; display:flex; }
  .gh{ flex:1; font-size:9px; color:#8a97a5; font-weight:700; }
  .grow{ height:30px; border-top:1px solid #f1f4f8; }
  .grow.off .glabel{ color:#c3ccd6; }
  .gtrack{ flex:1; position:relative; background-image:linear-gradient(to right,#eef1f5 1px,transparent 1px); background-size:calc(100%/13) 100%; }
  .gguide{ position:absolute; top:0; bottom:0; background:#f7f9fb; border-left:1px dashed #dbe3ec; border-right:1px dashed #dbe3ec; }
  .gband{ position:absolute; top:3px; bottom:3px; border-radius:6px; font-size:9.5px; font-weight:800; color:#33404d; display:flex; align-items:center; padding:0 4px; overflow:hidden; white-space:nowrap; box-shadow:0 1px 2px rgba(0,0,0,.14); }
  .gband.warn{ outline:2px solid var(--ng); }
  .gneed{ border-top:1.5px solid var(--bd); margin-top:2px; padding-top:3px; }
  .gn{ flex:1; text-align:center; font-size:9px; font-weight:800; color:var(--g); border-radius:4px; }
  .gn.lack{ color:#fff; background:var(--ng); }
  .gn.over{ color:var(--tm); }
  .gsum{ display:flex; justify-content:space-between; margin-top:7px; font-size:11px; font-weight:800; color:var(--sub); padding:0 2px; flex-wrap:wrap; gap:4px; }
  .dot{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .cfg{ background:#fff; border:1.5px solid var(--bd); border-radius:8px; padding:5px 10px; font-size:11px; font-weight:800; color:var(--navy); margin-right:8px; }
  .frow{ display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:13px; font-weight:700; flex-wrap:wrap; }
  .frow select,.frow input{ border:1.5px solid var(--bd); border-radius:9px; padding:8px; font-size:14px; background:#fff; }
  .aibar .add{ width:70px; background:#fff; color:var(--g); border:1.5px solid var(--g); border-radius:11px; font-size:12.5px; font-weight:800; }
  .aibar .ptm{ flex:1; background:#fff; color:var(--navy); border:1.5px solid var(--bd); border-radius:11px; padding:11px 0; font-size:12.5px; font-weight:800; }
  /* ポジションの時間設定 */
  .ptrow{ display:flex; align-items:center; gap:5px; padding:8px 2px; border-bottom:1px solid #eef1f5; font-size:13px; font-weight:700; flex-wrap:wrap; }
  .ptrow .pl{ width:78px; flex:none; font-size:12.5px; font-weight:800; }
  .ptrow select{ border:1.5px solid var(--bd); border-radius:8px; padding:6px 4px; font-size:13.5px; font-weight:700; background:#fff; }
  /* modal */
  .mask{ position:fixed; inset:0; background:rgba(20,30,45,.45); z-index:20; display:none; align-items:flex-end; justify-content:center; }
  .mask.on{ display:flex; }
  .sheet{ background:#fff; width:100%; max-width:560px; border-radius:16px 16px 0 0; padding:16px 16px calc(env(safe-area-inset-bottom) + 16px); max-height:75vh; overflow:auto; }
  .sheet h3{ font-size:14.5px; font-weight:800; margin-bottom:10px; }
  .pick{ display:flex; align-items:center; justify-content:space-between; padding:11px 4px; border-bottom:1px solid #eef1f5; }
  .pick .nm{ font-size:14px; font-weight:800; }
  .pick .av{ font-size:11px; font-weight:700; color:var(--sub); }
  .pick .av.ng{ color:var(--ng); }
  .pick .tgl{ width:60px; padding:8px 0; border-radius:9px; border:1.5px solid var(--bd); background:#fff; font-size:12px; font-weight:800; color:var(--sub); }
  .pick .tgl.on{ background:var(--gl); border-color:var(--g); color:var(--g); }
  .addrow{ display:flex; gap:8px; margin-top:10px; }
  .addrow input{ flex:1; border:1.5px solid var(--bd); border-radius:10px; padding:10px 12px; font-size:14px; }
  .addrow button{ background:var(--g); color:#fff; border:0; border-radius:10px; padding:0 18px; font-weight:800; }
  .staffrow{ display:flex; justify-content:space-between; align-items:center; padding:10px 4px; border-bottom:1px solid #eef1f5; }
  .staffrow .nm{ font-size:14px; font-weight:800; }
  .ord{ width:30px; padding:6px 0; border-radius:8px; border:1.5px solid var(--bd); background:#fff; font-size:12px; font-weight:800; color:var(--navy); margin-right:4px; }
  .ord:disabled{ opacity:.3; }
  .pgrid{ display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 2px; }
  .pchip{ font-size:12px; font-weight:800; border-radius:999px; padding:7px 12px; background:#eef2f7; color:#7b8a99; border:1.5px solid #dbe3ec; }
  .pchip.on{ background:var(--gl); border-color:var(--g); color:var(--g); }
  .del{ color:var(--ng); background:none; border:0; font-size:12px; font-weight:800; }
  .toast{ position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:#2c3a4d; color:#fff; border-radius:999px; padding:9px 20px; font-size:13px; font-weight:700; opacity:0; transition:.25s; pointer-events:none; z-index:40; }
  .toast.on{ opacity:1; }
  .linkbtn{ background:none; border:0; color:var(--sub); font-size:11.5px; font-weight:700; text-decoration:underline; }
  /* 店舗切替 */
  .shopsw{ display:flex; gap:6px; margin-bottom:10px; }
  .shopsw button{ flex:1; border:1.5px solid var(--bd); background:#fff; border-radius:10px; padding:9px 0; font-size:12.5px; font-weight:800; color:var(--sub); }
  .shopsw .on{ background:var(--gl); border-color:var(--g); color:var(--g); }
  .hd.mgr ~ * .shopsw .on{ background:#e9edf5; border-color:var(--navy); color:var(--navy); }
  .hdsimple{ background:var(--g); color:#fff; padding:calc(env(safe-area-inset-top) + 14px) 16px 12px; }
  .hdsimple h1{ font-size:17px; font-weight:800; }
  .hdsimple .s{ font-size:12px; opacity:.85; font-weight:700; }
  /* 印刷 */
  .printview{ display:none; }
  @media print{
    @page{ size:A4 landscape; margin:8mm; }
    body{ background:#fff; max-width:none; padding:0; }
    .app{ display:none !important; }
    .printview{ display:block; padding:0; }
    .printview h2{ font-size:13pt; margin-bottom:3mm; }
    table.pt{ width:100%; border-collapse:collapse; font-size:7pt; table-layout:fixed; }
    table.pt th, table.pt td{ border:1px solid #333; padding:2pt 1pt; text-align:center; vertical-align:middle; }
    table.pt th{ background:#eee; }
    table.pt td.nm2{ text-align:left; padding-left:3pt; font-weight:bold; white-space:nowrap; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="printview" id="printview"></div>
<div class="mask" id="mask" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ====== シフト希望 お試し版（おはし二日町／落合・8月後半） ====== */
var PERIOD={ ym:"2026-08", label:"8月後半", days:[], due:"8/5(水)", pub:"8/10" };
for(var d=16; d<=31; d++) PERIOD.days.push(d);
var WD=["日","月","火","水","木","金","土"];
function wday(day){ return new Date(2026,7,day).getDay(); }
/* 祝日（この期間内の日にち。土日と同じ「土日祝」の必要人数で計算します） */
var HOLIDAYS=[];
function isHol(day){ var w=wday(day); return w===0||w===6||HOLIDAYS.indexOf(day)>=0; }

/* ====== 店舗ごとの設定 ======
   open/close   … ガントチャートの時間軸（分）
   pos          … ポジション
   needWd/needHd… 開店時刻から1時間ごとの必要人数（平日／土日祝）
   band         … ポジションを使う時間帯（分）の初期値。店長画面「ポジションの時間設定」で
                  変更でき、変更した内容は DATA.postime に保存されます（この値より優先）
   off          … その曜日区分では使わないポジション
   prio         … ポジションごとの「優先スタッフ」の初期値（①②③…の順）。名前で書きます。
                  店長画面「👑 ポジションの優先スタッフ」で変更でき、変更した内容は
                  DATA.prio に保存されます（この値より優先）。まだ登録されていない名前は無視します
*/
var SHOPS=[
  { id:"ohashi", name:"おはし二日町", doc:"shifttrial_ohashi",
    open:600, close:1380,                                    /* 10:00〜23:00 */
    pos:[
      { id:"p1", label:"仕込①" }, { id:"p2", label:"ランチ①" }, { id:"p3", label:"ランチ②" },
      { id:"p4", label:"ランチ③" }, { id:"p11", label:"厨房" }, { id:"p5", label:"厨房補助" },
      { id:"p6", label:"ドリンク" },
      { id:"p7", label:"ホール①" }, { id:"p8", label:"ホール②" }, { id:"p9", label:"ホール③" },
      { id:"p10", label:"ホール④" }
    ],
    /* 10時から1時間ごと（従来の時間帯設定をそのまま平日・土日祝の両方に入れています） */
    needWd:[2,3,3,3,2,2,2,2,5,5,5,3,3],
    needHd:[2,3,3,3,2,2,2,2,5,5,5,3,3],
    /* ポジションを使う時間帯の初期値（店長が画面から変えられます）。
       書いていないポジション（厨房・厨房補助）は終日つかえる扱いです */
    band:{
      wd:{ p1:[600,900], p2:[660,900], p3:[660,900], p4:[660,900],
           p6:[1020,1380], p7:[1020,1380], p8:[1020,1380], p9:[1020,1380], p10:[1020,1380] },
      hd:{ p1:[600,900], p2:[660,900], p3:[660,900], p4:[660,900],
           p6:[1020,1380], p7:[1020,1380], p8:[1020,1380], p9:[1020,1380], p10:[1020,1380] }
    },
    /* ランチ①②③は 梅田佳央里・佐藤佳菜・伊藤恵子 の3人を優先（出られる日は先に入ります） */
    prio:{ p2:["梅田佳央里","佐藤佳菜","伊藤恵子"],
           p3:["梅田佳央里","佐藤佳菜","伊藤恵子"],
           p4:["梅田佳央里","佐藤佳菜","伊藤恵子"] },
    off:{} },
  { id:"ochiai", name:"落合", doc:"shifttrial_ochiai",
    open:300, close:1260,                                    /* 5:00〜21:00 */
    pos:[
      { id:"p1", label:"オーブン" }, { id:"p2", label:"カレーパン" }, { id:"p3", label:"昼①" },
      { id:"p4", label:"昼②" }, { id:"p5", label:"昼③" }, { id:"p6", label:"昼④" },
      { id:"p7", label:"午後①" }, { id:"p8", label:"午後②" }, { id:"p9", label:"午後③" },
      { id:"p10", label:"外販" }
    ],
    /* 5時から1時間ごと */
    needWd:[1,2,3,5,6,4,4,3,3,3,3,3,2,2,0,0],   /* 合計44 */
    needHd:[1,2,2,4,5,3,3,2,2,2,2,2,2,2,0,0],   /* 合計34 */
    band:{
      wd:{ p1:[300,570], p2:[360,570], p3:[420,720], p4:[420,840], p5:[510,900],
           p7:[840,1020], p8:[840,1140], p9:[900,1140], p10:[480,840] },
      hd:{ p1:[300,570], p2:[360,570], p3:[480,720], p4:[480,840], p5:[480,900],
           p7:[840,1140], p8:[840,1140], p9:[840,1140] }
    },
    /* オーブン（パンを焼く担当）＝鈴木勇気／カレーパン＝高橋とき・高橋マユミ・逢坂和也の内1人／
       外販＝長谷部琉衣→鈴木彩愛→秋山さやか の優先順で1人 */
    prio:{ p1:["鈴木勇気"],
           p2:["高橋とき","高橋マユミ","逢坂和也"],
           p10:["長谷部琉衣","鈴木彩愛","秋山さやか"] },
    off:{ hd:["p10"] },                                      /* 土日祝は外販なし */
    maxShift:360 }                                           /* 自動作成で1人が続けて入る上限（6時間） */
];
var PAL=["#f6c944","#f0a13a","#8fce7a","#4fb586","#f2a9a0","#8ab6e8","#b48fd9","#e88ab5","#6fc7c1","#c9b26a"];
var WAGE=1000;              /* 概算人件費の時給換算 */
/* 現在の店舗（applyShop で切り替え） */
var SHOP=SHOPS[0], POS=SHOP.pos, DAY_OPEN=SHOP.open, DAY_CLOSE=SHOP.close;
function shopBy(id){ return SHOPS.filter(function(s){return s.id===id;})[0]; }
function applyShop(id){ var s=shopBy(id); if(!s)return false;
  SHOP=s; POS=s.pos; DAY_OPEN=s.open; DAY_CLOSE=s.close; return true; }
/* 曜日区分ごとの必要人数・目安の帯・使わないポジション */
function dkey(day){ return isHol(day)?"hd":"wd"; }
function needsFor(day){ return (dkey(day)==="hd"? SHOP.needHd : SHOP.needWd)||[]; }
/* ポジションを使う時間帯。店長が画面で設定した内容（DATA.postime）を最優先、
   なければ店舗の初期値（SHOP.band）、それも無ければ null＝終日つかえる。
   DATA.postime[区分][ポジション] が 0 のときは「終日」を明示した状態 */
function bandKey(pid,k){
  var pt=(DATA.postime||{})[k];
  if(pt&&Object.prototype.hasOwnProperty.call(pt,pid)){ var v=pt[pid];
    return (v&&v.length===2&&v[0]<v[1])?[v[0],v[1]]:null; }
  var b=(SHOP.band||{})[k]; return (b&&b[pid])?[b[pid][0],b[pid][1]]:null; }
function bandOf(pid,day){ return bandKey(pid,dkey(day)); }
/* その時間はそのポジションを使う時間帯と重なっているか（まったく重ならない＝入れてはいけない） */
function fitsPos(pid,day,f,t){ var b=bandOf(pid,day); return !b||(f<b[1]&&b[0]<t); }
/* すでに人が入っているポジションを避ける重み。「終日ポジション」の基準点(720)より大きく、
   「時間帯とまったく重ならない」(1e6)よりはずっと小さいので、
   空いているポジションを優先しつつ、時間帯から外れた場所に回すことはありません */
var USED_PEN=900;
/* 優先スタッフを決めたポジションを、そこに指定されていない人が埋めてしまうのを避ける重み。
   （社員が先に入って、バイトの入るポジションが無くなるのを防ぐための「枠」の考え方）
   USED_PEN より大きく、「時間帯とまったく重ならない」(1e6)よりはずっと小さいので、
   どうしても他に空きがないときは今までどおり入ります */
var PRIO_PEN=1500;
/* ポジションの時間帯とのはまり具合を点数にする（大きいほど良い）。時間帯なし＝どこでも可の基準点 */
function posScore(pid,day,f,t){ var b=bandOf(pid,day);
  if(!b) return -720;
  if(t<=b[0]||b[1]<=f) return -1e6;                       /* まったく重ならない */
  var over=Math.max(0,b[0]-f)+Math.max(0,t-b[1]);         /* はみ出した分 */
  return -over*5-(Math.abs(b[0]-f)+Math.abs(b[1]-t))/60; }
function posFor(day){ var off=(SHOP.off||{})[dkey(day)]||[];
  return POS.filter(function(p){ return off.indexOf(p.id)<0; }); }
/* 必要人数を1時間ずつの枠にする（自動作成はこれを順に埋めていく） */
function hoursFor(day){ var a=needsFor(day), out=[];
  for(var i=0;i<a.length;i++){ if(a[i]) out.push({ from:fmtHM(DAY_OPEN+i*60), to:fmtHM(DAY_OPEN+(i+1)*60), need:a[i] }); }
  return out; }
/* 必要人数（1時間ごと）を、連続する同じ人数でまとめた時間帯にする（表示・確認用） */
function slotsFor(day){ var a=needsFor(day), out=[], i=0;
  while(i<a.length){ if(!a[i]){ i++; continue; }
    var j=i; while(j+1<a.length&&a[j+1]===a[i]) j++;
    out.push({ from:fmtHM(DAY_OPEN+i*60), to:fmtHM(DAY_OPEN+(j+1)*60), need:a[i] });
    i=j+1; }
  return out; }

  ["wd","hd"].forEach(function(k){ var o=DATA.postime[k]||{};
    POS.forEach(function(p){ var b=PTTMP[k][p.id]; o[p.id]=b?[b[0],b[1]]:0; });   /* 0＝終日 */
    DATA.postime[k]=o; });
  save(); closeSheet(); toast("ポジションの時間を保存しました"); render();
}

  openPosTime(); toast("最初の設定にもどしました"); }

/* ---- ポジションごとの優先スタッフ（①②③…）（店長） ----
   「保存」を押すまでは PPTMP の中だけで編集し、保存すると DATA.prio に入ります */
var PPTMP=null, PPSEL=null;
function openPosPrio(){
  PPTMP={}; POS.forEach(function(p){ PPTMP[p.id]=prioOf(p.id).slice(); });
  PPSEL=null; renderPosPrio(); el("mask").classList.add("on");
}
function ppNames(l){ return l.map(function(sid,i){ var s=staffBy(sid);
  return maru(i)+esc(s?s.name:"?"); }).join(" "); }
function renderPosPrio(){
  if(PPSEL) return renderPosPrioEdit();
  var rows=POS.map(function(p){ var l=PPTMP[p.id]||[];
    return '<div class="ptrow" onclick="ppEdit(\''+p.id+'\')" style="cursor:pointer">'
      +'<span class="pl">'+esc(p.label)+'</span>'
      +'<span style="flex:1;font-size:12.5px;'+(l.length?'':'color:#b6c2d0')+'">'+(l.length?ppNames(l):'指定なし')+'</span>'
      +'<span class="cfg" style="margin:0">変更</span></div>';
  }).join("");
  el("sheet").innerHTML='<h3>ポジションの優先スタッフ（'+esc(SHOP.name)+'）</h3>'
   +'<p class="tip">そのポジションに<b>先に入れたい人</b>を①②③…の順で決めます。「✨下書きを自動作成」では、①の人がその日出られればその場所に入り、休みなら②の人、その次は③の人…という順で入ります（1つのポジションには1人）。</p>'
   +'<p class="tip">ここで決めた人以外（社員をふくむ）は、そのポジションをできるだけ<b>空けて</b>ほかの場所に入るので、社員が先に埋めてしまってアルバイトが入れない、ということが起きにくくなります。</p>'
   +rows
   +'<div class="addrow" style="margin-top:10px"><button onclick="savePosPrio()">保存</button></div>'
   +'<div style="text-align:center;margin-top:10px"><button class="linkbtn" onclick="ppResetAll()">最初の設定にもどす</button>'
   +'　<button class="linkbtn" onclick="closeSheet()">閉じる</button></div>';
}
function ppEdit(pid){ PPSEL=pid; renderPosPrio(); }
function ppBack(){ PPSEL=null; renderPosPrio(); }
function renderPosPrioEdit(){
  var pid=PPSEL, l=PPTMP[pid]||[], n=l.length;
  var sel=l.map(function(sid,i){ var s=staffBy(sid);
    return '<div class="staffrow"><span class="nm">'+maru(i)+' '+esc(s?s.name:"?")+'</span>'
      +'<span style="white-space:nowrap">'
      +'<button class="ord" onclick="ppMove('+i+',-1)"'+(i===0?' disabled':'')+'>↑</button>'

   +'<div class="frow" style="margin:10px 0 0">追加する人をタップ：</div>'
   +'<div class="pgrid">'+(chips||'<span class="mini">'+(DATA.staff.length?'全員えらび終わりました':'先に「スタッフ」タブで登録してください')+'</span>')+'</div>'
   +'<p class="tip">上にある人ほど優先されます（↑↓で入れかえ）。その日に休み・時間が合わない人はとばして、次の人が入ります。</p>'
   +'<div class="addrow" style="margin-top:8px"><button onclick="ppBack()">この内容でもどる</button></div>'
   +'<p class="tip" style="text-align:center">※ 最後に一覧の「保存」を押すと決定されます</p>';
}
function ppAdd(sid){ var l=PPTMP[PPSEL]; if(l.indexOf(sid)<0)l.push(sid); renderPosPrio(); }
function ppDel(i){ PPTMP[PPSEL].splice(i,1); renderPosPrio(); }
function ppMove(i,dir){ var l=PPTMP[PPSEL], j=i+dir; if(j<0||j>=l.length)return;
  var t=l[i]; l[i]=l[j]; l[j]=t; renderPosPrio(); }
function savePosPrio(){
  DATA.prio=DATA.prio||{};
  POS.forEach(function(p){ DATA.prio[p.id]=(PPTMP[p.id]||[]).slice(); });
  save(); closeSheet(); toast("優先スタッフを保存しました"); render();
}
function ppResetAll(){ if(!confirm("優先スタッフをお店の最初の設定にもどしますか？"))return;

function saveEnt(day,eid){
  var sid=el("ent_s").value, pos=el("ent_p").value, f=el("ent_f").value, t=el("ent_t").value;
  if(!sid){ toast("スタッフを選んでください"); return; }
  if(minutes(t)<=minutes(f)){ toast("終わりの時間は始まりより後にしてください"); return; }
  var ents=shiftOf(day);
  if(eid){ var e=ents.filter(function(x){return x.id===eid;})[0]; if(e){ e.sid=sid; e.pos=pos; e.f=f; e.t=t; } }
  else ents.push({id:uid(),sid:sid,pos:pos,f:f,t:t});
  if(otherHit(sid,day,minutes(f),minutes(t))) toast("※他のお店（"+otherLabel(sid,day)+"）と重なっています（⚠表示）");
  else if(!canPos(staffBy(sid),pos)) toast("※このポジションは担当外で登録しました（⚠表示）");
  else if(!fitsPos(pos,day,minutes(f),minutes(t))){ var b=bandOf(pos,day);
    toast("※"+posLabel(pos)+"は"+fmtT(b[0])+"〜"+fmtT(b[1])+"の時間です（⚠表示）"); }
  save(); closeSheet(); render();
}
function delEnt(day,eid){ DATA.shift[day]=shiftOf(day).filter(function(x){return x.id!==eid;}); save(); closeSheet(); render(); }
function autoDraft(){
  var ents=shiftOf(MDAY);
  if(ents.length&&!confirm("この日の下書きを作り直します（今の帯は置き換わります）。よろしいですか？"))return;
  var SLOTS=hoursFor(MDAY);   /* 店舗ごと・平日／土日祝ごとの必要人数を1時間ずつ埋めていく */
  if(!SLOTS.length){ toast("この日は必要人数が0です（設定を確認してください）"); return; }
  DATA.shift[MDAY]=[];
  /* 公平さ：期間内の他の日の割当日数・時間＋本人の週回数条件 */
  var days={}, minsA={};
  DATA.staff.forEach(function(s){ days[s.id]=0; minsA[s.id]=0; });
  Object.keys(DATA.shift).forEach(function(d){ if(+d===MDAY)return; var seen={};
    (DATA.shift[d]||[]).forEach(function(e){ minsA[e.sid]=(minsA[e.sid]||0)+(minutes(e.t)-minutes(e.f));
      if(!seen[e.sid]){ days[e.sid]=(days[e.sid]||0)+1; seen[e.sid]=1; } }); });
  function tgt(s){ return s.wk? Math.max(1,Math.round(s.wk*PERIOD.days.length/7)) : 999; }
  var act={}, out=[], done={}, started={};
  /* 1人が続けて入る上限（設定した店舗だけ。未設定＝従来どおり上限なし） */
  var MAXSH=SHOP.maxShift||0;
  /* 社員＝先に配置する人。基本終日なので「続けて入る上限」と「一度上がったら終わり」の対象外 */
  var EMP={}; DATA.staff.forEach(function(s){ if(s.emp)EMP[s.id]=1; });
  var nEmp=Object.keys(EMP).length;
  /* その枠に入れるか：本人の希望・条件に合い、かつ他のお店の予定と重ならないこと */
  function freeAt(sid,f,t){ return fitsReq(sid,MDAY,f,t)&&!otherHit(sid,MDAY,f,t); }
  /* だれから入れるか（回数の少ない人・働いた時間が短い人から） */
  function rank(x,y){ var rx=(days[x.id]||0)/tgt(x), ry=(days[y.id]||0)/tgt(y);
    if(rx!==ry)return rx<ry?-1:1; return (minsA[x.id]||0)-(minsA[y.id]||0); }
  /* 社員は人数が減る時間にいったん外れて後でまた入ることがあるので、
     その日の回数は1回だけ数える（アルバイトの数え方は従来どおり変えない） */
  function startEmp(sid,f,t,next){ next[sid]={f:f,t:t};
    if(!started[sid]){ days[sid]=(days[sid]||0)+1; started[sid]=1; } }
  /* ポジションごとの優先スタッフ（①②③…）。その日に使うポジションだけ見る */
  var USEPOS=posFor(MDAY);
  var nPrio=USEPOS.filter(function(p){ return hasPrio(p.id); }).length;
  SLOTS.forEach(function(sl){
    var f=minutes(sl.from), t=minutes(sl.to), next={};
    /* ⓪ ポジションごとの優先スタッフを先に確保する（1つのポジションに1人）。
       上の順位の人がその時間に出られなければ、次の順位の人へ。だれも出られなければ空けておく。
       確保した人は「どのポジションか」も一緒に覚えておき（pin）、あとでその場所に入れる */
    if(nPrio) USEPOS.forEach(function(p){
      if(Object.keys(next).length>=sl.need) return;
      var lst=prioOf(p.id); if(!lst.length) return;
      if(!fitsPos(p.id,MDAY,f,t)) return;             /* そのポジションを使う時間帯の外 */
      for(var i=0;i<lst.length;i++){ var sid=lst[i];
        if(next[sid]) continue;                       /* この枠ですでに別のポジションに確保ずみ */
        if(!EMP[sid]&&done[sid]) continue;            /* もう上がった人 */
        if(!freeAt(sid,f,t)) continue;                /* 休み・時間指定・他店と重なる */
        var a=act[sid];
        if(a&&a.pin===p.id&&freeAt(sid,a.f,t)&&(EMP[sid]||!MAXSH||t-a.f<=MAXSH)){ next[sid]=a; a.t=t; }
        else { next[sid]={f:f,t:t,pin:p.id};
          if(EMP[sid]){ if(!started[sid]){ days[sid]=(days[sid]||0)+1; started[sid]=1; } }
          else days[sid]=(days[sid]||0)+1; }
        break; }
    });
    /* ① まず社員を入れる。すでに入っている社員はそのまま延長（終日つながった帯になる） */
    if(nEmp) DATA.staff.filter(function(s){ return EMP[s.id]&&!next[s.id]&&freeAt(s.id,f,t); })
      .sort(function(x,y){ var ax=act[x.id]?0:1, ay=act[y.id]?0:1;   /* 続けて入っている人が先 */
        if(ax!==ay)return ax-ay; return rank(x,y); })
      .forEach(function(s){
        if(Object.keys(next).length>=sl.need)return;
        /* 優先ポジションに入っていた帯（pin）は、その時間が終わったらここで区切る（別の場所へ移るため） */
        if(act[s.id]&&!act[s.id].pin&&freeAt(s.id,act[s.id].f,t)){ next[s.id]=act[s.id]; next[s.id].t=t; }
        else startEmp(s.id,f,t,next); });
    /* ② 前の枠から続けられるアルバイトを残す（長い帯になる）。
       人数が減る時間に誰を残すかは、上限を設けた店舗では「働いている時間が短い人を残す」
       ＝長く働いた人から先に上がってもらう（1時間だけの細切れシフトを防ぐ） */
    var carry=Object.keys(act).filter(function(sid){ return !EMP[sid]&&!next[sid]&&!act[sid].pin; });
    if(MAXSH) carry.sort(function(a,b){ return act[b].f-act[a].f; });
    carry.forEach(function(sid){ if(Object.keys(next).length<sl.need&&freeAt(sid,act[sid].f,t)
      &&(!MAXSH||t-act[sid].f<=MAXSH)){ next[sid]=act[sid]; next[sid].t=t; } });
    /* この枠で上がった人は、同じ日にもう一度入れない（上限を設けた店舗のみ）。
       ここを「後回し」にしていたため、上がった直後の枠でその人がまた選ばれてしまい、
       それまで働いていた帯が消える／同じ人が細切れに分かれる原因になっていた
       （社員は終日つづける前提なので対象外） */
    if(MAXSH) Object.keys(act).forEach(function(sid){ if(!EMP[sid]&&!next[sid]) done[sid]=1; });
    /* ③ 足りないところをアルバイトで埋める */
    var cands=DATA.staff.filter(function(s){ return !EMP[s.id]&&!next[s.id]&&!done[s.id]&&freeAt(s.id,f,t); })
      .sort(rank);
    while(Object.keys(next).length<sl.need&&cands.length){ var s=cands.shift(); next[s.id]={f:f,t:t}; days[s.id]=(days[s.id]||0)+1; }
    /* 続けて働く人（next に同じ帯が入っている人）以外は、ここで帯を確定させる。
       「!next[sid]」だと上がった人が同じ枠で入り直したときに帯を取りこぼすので、同じ帯かどうかで見る */
    Object.keys(act).forEach(function(sid){ if(next[sid]!==act[sid])out.push({sid:sid,f:act[sid].f,t:act[sid].t,pin:act[sid].pin}); });
    act=next;
  });
  Object.keys(act).forEach(function(sid){ out.push({sid:sid,f:act[sid].f,t:act[sid].t,pin:act[sid].pin}); });
  out.sort(function(x,y){return x.f-y.f||y.t-x.t;});
  /* ポジション決め：優先スタッフで確保した帯（pin）を先に置き、
     そのあと担当できるポジションが少ない人から埋める（融通のきく人を後回しに） */
  var placed=[], ng=0, nPin=0;
  function posFree(pid,f,t){ return !placed.some(function(x){ return x.pos===pid&&overlapMM(minutes(x.f),minutes(x.t),f,t); }); }
  out.map(function(e,i){ return i; })
     .sort(function(a,b){ var pa=out[a].pin?0:1, pb=out[b].pin?0:1;
       if(pa!==pb)return pa-pb; return capCount(out[a].sid)-capCount(out[b].sid); })
     .forEach(function(i){ var e=out[i];
       if(e.pin&&posFree(e.pin,e.f,e.t)){ e.pos=e.pin; nPin++; }
       else e.pos=freePos(placed,e.f,e.t,e.sid,MDAY);
       if(!canPos(staffBy(e.sid),e.pos))ng++;
       placed.push({pos:e.pos,f:fmtHM(e.f),t:fmtHM(e.t)}); });
  out.forEach(function(e){ DATA.shift[MDAY].push({id:uid(),sid:e.sid,pos:e.pos,f:fmtHM(e.f),t:fmtHM(e.t)}); });
  /* 出られる人が足りず必要人数に届かなかった時間を数えて知らせる（黙って埋まったように見せない） */
  var lack=0; SLOTS.forEach(function(sl){ var m=minutes(sl.from), got=0;
    out.forEach(function(e){ if(e.f<=m&&m<e.t)got++; }); if(got<sl.need) lack+=sl.need-got; });
  var msg="下書きを作成しました";
  if(nPin) msg+="（優先スタッフ"+nPin+"件を先に配置）";
  var eIn={}; out.forEach(function(e){ if(EMP[e.sid]) eIn[e.sid]=1; });
  if(Object.keys(eIn).length) msg+="（社員"+Object.keys(eIn).length+"人を先に配置）";
  if(lack) msg+="（のべ"+lack+"時間ぶん人が足りません・赤い数字の時間）";
  if(ng) msg+="（⚠"+ng+"件は担当できるポジションが空いていません）";
  save(); toast(msg); render();
}

/* スタッフ管理＋条件設定 */
function mgrStaff(){
  ensureColors();
  var n=DATA.staff.length;
  var rows=DATA.staff.map(function(s,i){
    var cond=[]; if(s.emp)cond.push("👔社員"); if(s.both)cond.push("🔁両店舗");
    if(s.avF||s.avT)cond.push((s.avF||"開店")+"〜"+(s.avT||"閉店")); if(s.wk)cond.push("週"+s.wk+"回");
    if(s.pos&&s.pos.length&&s.pos.length<POS.length){
      var nm=s.pos.slice(0,3).map(posLabel).join("・");
      cond.push(nm+(s.pos.length>3?"他"+(s.pos.length-3):""));
    }
    return '<div class="staffrow"><span class="nm"><span class="dot" style="background:'+staffColor(s.id)+'"></span>'+esc(s.name)
      +(cond.length?'<br><span class="mini">'+esc(cond.join("／"))+'</span>':'')+'</span>'
      +'<span style="white-space:nowrap">'
      +'<button class="ord" onclick="moveStaff('+i+',-1)"'+(i===0?' disabled':'')+'>↑</button>'
      +'<button class="ord" onclick="moveStaff('+i+',1)"'+(i===n-1?' disabled':'')+'>↓</button>'
      +'<button class="cfg" onclick="openCond(\''+s.id+'\')">条件</button><button class="del" onclick="delStaff(\''+s.id+'\')">削除</button></span></div>';
  }).join("");
  return '<div class="card">'+(rows||'<p class="tip">タップして最初のスタッフを追加してください。</p>')
    +'<div class="addrow"><input id="newname" placeholder="スタッフの名前"><button onclick="addStaff()">追加</button></div></div>'
    +'<p class="tip">「条件」＝<b>社員かアルバイトか</b>・<b>両店舗で働くか</b>・基本の勤務可能時間・週の回数・<b>できるポジション</b>。設定すると「出られる」の日はその時間内でだけ組まれ、自動作成も回数と担当できるポジションを守ろうとします。</p>'
    +'<p class="tip">👔<b>社員</b>にした人は、自動作成でいちばん先に配置されます（できるだけ長く1本の帯で）。そのあと足りないところにアルバイトが入ります。<b>社員に入ってほしい場所</b>は「シフト作成」タブの<b>👑ポジションの優先スタッフ</b>で決められます（決めておくと、そのほかのポジションは社員が埋めずにアルバイトのために空きます）。</p>'
    +'<p class="tip">🔁<b>両店舗</b>にした人は、もう一方のお店の予定を見て、同じ時間に重ならないように組まれます。<b>両方のお店で同じ名前で登録</b>してください（名前で同じ人と判断します）。希望の入力は、お店を切り替えてそれぞれで行います。</p>'
    +'<p class="tip">↑↓で並び順を変えられます。この順番が「希望一覧」「印刷したシフト表」にもそのまま反映されます（色は人ごとに固定なので変わりません）。</p>';
}

  var t=DATA.staff[i]; DATA.staff[i]=DATA.staff[j]; DATA.staff[j]=t; save(); render(); }

/* 社員／アルバイト・両店舗兼務の切り替え */
function renderCondEmp(){
  var g=el("cnd_emp"); if(!g)return;
  g.innerHTML='<button class="pchip'+(CONDEMP?' on':'')+'" onclick="setCondEmp(1)">👔 社員</button>'
    +'<button class="pchip'+(CONDEMP?'':' on')+'" onclick="setCondEmp(0)">アルバイト</button>'
    +'<button class="pchip'+(CONDBOTH?' on':'')+'" onclick="toggleCondBoth()">🔁 両店舗で働く</button>';
  el("cnd_emphint").innerHTML=(CONDEMP
    ? '<b>社員</b>＝自動作成でいちばん先に、できるだけ長い1本の帯で入れます。足りないところにアルバイトが入ります。（日ごとの「休み」「時間指定」は今までどおり守ります）'
    : '<b>アルバイト</b>＝社員を入れたあと、足りないところに入ります。')
    +(CONDBOTH?'<br>🔁 '+esc(otherShops().map(function(x){return x.name;}).join("・"))+'でも働く人。<b>両方のお店で同じ名前で登録</b>してください。もう一方のお店で入っている時間には、自動作成で入れません（手で入れると⚠が出ます）。':'');
}
function setCondEmp(v){ CONDEMP=v?1:0; renderCondEmp(); }
function toggleCondBoth(){ CONDBOTH=CONDBOTH?0:1; renderCondEmp(); }
function renderCondPos(){
  var g=el("cnd_pos"); if(!g)return;
  g.innerHTML=POS.map(function(p){
    return '<button class="pchip'+(CONDPOS.indexOf(p.id)>=0?' on':'')+'" onclick="toggleCondPos(\''+p.id+'\')">'+p.label+'</button>'; }).join("")
    +(CONDPOS.length?'<button class="pchip" onclick="clearCondPos()">ぜんぶ解除</button>':'');
  el("cnd_poshint").innerHTML=CONDPOS.length
    ? '選んだ'+CONDPOS.length+'つのポジションだけに入ります。自動作成もここを守ります（手で入れることは可能・その場合⚠が出ます）。'
    : '<b>何も選ばない＝どのポジションもできる</b>という意味です。新しく入った人など、できる場所が決まっている人だけ選んでください。';
}
function toggleCondPos(pid){ var i=CONDPOS.indexOf(pid); if(i>=0)CONDPOS.splice(i,1); else CONDPOS.push(pid); renderCondPos(); }
function clearCondPos(){ CONDPOS=[]; renderCondPos(); }
function saveCond(sid){ var s=staffBy(sid); if(!s)return;
  s.avF=el("cnd_f").value||""; s.avT=el("cnd_t").value||"";
  var w=parseInt(el("cnd_w").value,10); s.wk=(isNaN(w)||w<=0)?0:w;
  s.pos=(CONDPOS.length===POS.length)?[]:CONDPOS.slice();  /* 全部選んだ＝制限なしと同じ */
  s.emp=CONDEMP?1:0; s.both=CONDBOTH?1:0;
  save(); closeSheet(); toast("条件を保存しました"); loadOther(); render(); }
function addStaff(){ var v=el("newname").value.trim(); if(!v)return; DATA.staff.push({id:uid(),name:v,pos:[]}); ensureColors(); save(); render(); }
function delStaff(id){ if(!confirm("削除しますか？（希望データも消えます）"))return; DATA.staff=DATA.staff.filter(function(s){return s.id!==id;}); delete DATA.req[id]; delete DATA.submitted[id]; save(); render(); }

/* 印刷ビュー（元のExcel様式に近い：スタッフ×日で時刻レンジ） */
function renderPrint(){
  PERIOD.days.forEach(function(d){ shiftOf(d); });
  var head='<tr><th style="width:60pt">名前</th>'+PERIOD.days.map(function(d){ var w=wday(d);
    return '<th>'+d+'<br>'+WD[w]+'</th>'; }).join("")+'</tr>';
  var rows=DATA.staff.map(function(s){
    return '<tr><td class="nm2">'+esc(s.name)+'</td>'+PERIOD.days.map(function(d){
      var es=(DATA.shift[d]||[]).filter(function(e){return e.sid===s.id;}).sort(function(x,y){return minutes(x.f)-minutes(y.f);});
      var merged=[]; es.forEach(function(e){ var f=minutes(e.f),t=minutes(e.t); var last=merged[merged.length-1];
        if(last&&f<=last[1]){ last[1]=Math.max(last[1],t); } else merged.push([f,t]); });
      return '<td>'+merged.map(function(p){return fmtT(p[0])+'-'+fmtT(p[1]);}).join("<br>")+'</td>'; }).join("")+'</tr>';
  }).join("");
  var tot='<tr><td class="nm2">人数</td>'+PERIOD.days.map(function(d){ var n={};
    (DATA.shift[d]||[]).forEach(function(e){ n[e.sid]=1; }); return '<td>'+Object.keys(n).length+'</td>'; }).join("")+'</tr>';
  var hrs='<tr><td class="nm2">のべ時間</td>'+PERIOD.days.map(function(d){ var m=0;
    (DATA.shift[d]||[]).forEach(function(e){ m+=minutes(e.t)-minutes(e.f); }); return '<td>'+(m?Math.round(m/6)/10:"")+'</td>'; }).join("")+'</tr>';
  el("printview").innerHTML='<h2>'+esc(SHOP.name)+'　'+PERIOD.label+'（8/16〜8/31）シフト表</h2><table class="pt">'+head+rows+tot+hrs+'</table>';
}

/* ---- 起動 ---- */
if(SHOPID) loadShop(SHOPID);
render();
if(SHOPID) pull().then(render);
setInterval(function(){ if(SHOPID&&!el("mask").classList.contains("on")) pull(); }, 25000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden&&SHOPID) pull(); });
</script>
